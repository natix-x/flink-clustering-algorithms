# Local-run logging (slf4j-simple binding, used by local_run.sh via the test classpath).
# Format mirrors the Spark repo's log4j2 pattern:
#   %d{yyyy-MM-dd HH:mm:ss} [%t] %-5p %c{1} - %m%n
# -> "2026-07-11 12:00:00 [main] INFO clustering.benchmark.FlinkClusteringJob - <msg>"
# Root WARN, our clustering.* packages INFO — same levels as Spark's log4j2.properties.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.log.clustering=info

org.slf4j.simpleLogger.logFile=System.out
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss
org.slf4j.simpleLogger.showThreadName=true
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.levelInBrackets=false
